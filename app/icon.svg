<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191d"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>
    <linearGradient id="folioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0ec"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#2a2c34" stroke-width="1.5"/>

  <!-- Under-layer index card for depth -->
  <rect x="37" y="24" width="58" height="76" rx="8" fill="#23252c" stroke="#333640" stroke-width="1.2"/>

  <!-- Main Academic Index Folio -->
  <path d="M 28 40
           C 28 33.5 33 28.5 39.5 28.5
           L 68 28.5
           C 70.2 28.5 72.1 27.2 73.2 25.3
           L 74.8 22.8
           C 76.2 20.6 78.6 19.2 81.3 19.2
           L 91.5 19.2
           C 96.2 19.2 100 23 100 27.7
           L 100 92.5
           C 100 98.8 94.8 104 88.5 104
           L 39.5 104
           C 33.2 104 28 98.8 28 92.5
           Z"
        fill="url(#folioGrad)"
        filter="url(#cardShadow)"/>

  <!-- Amber Bookmark Focus Point -->
  <circle cx="89" cy="27" r="3.5" fill="url(#amberGrad)"/>

  <!-- Monogram S / Index Mark -->
  <path d="M 72 44
           C 67.5 40.5 56 40 52 44
           C 47.5 48.5 48.5 54.5 54 57.5
           L 66 63.5
           C 72.5 66.8 73.5 74 68 78.5
           C 62.5 83 50.5 82.5 45 78.5"
        fill="none"
        stroke="#111111"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Ledger Lines -->
  <line x1="45" y1="89" x2="83" y2="89" stroke="#9e9e98" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="96" x2="70" y2="96" stroke="#c0c0b8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
